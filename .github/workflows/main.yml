name: generate-and-upload-card

on:
  # Run automatically once a day.
  schedule:
    - cron: "0 0 * * *"

  # Allow the workflow to be run manually.
  workflow_dispatch:

  # Regenerate the cards whenever this workflow changes on the default branch.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main.yml"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check pixel profile token
        env:
          PIXEL_PROFILE_TOKEN: ${{ secrets.PIXEL_PROFILE_TOKEN }}
        run: |
          if [ -z "$PIXEL_PROFILE_TOKEN" ]; then
            echo "::error::Missing PIXEL_PROFILE_TOKEN repository secret. The default GITHUB_TOKEN cannot read stargazers across repositories."
            exit 1
          fi

      - name: Generate GitHub stats cards
        # Pin the action because this step receives a personal access token.
        uses: LuciNyan/pixel-profile/action@7a7937a63421dd6eba82aaae31f73e85df8d9f94
        with:
          github_token: ${{ secrets.PIXEL_PROFILE_TOKEN }}
          outputs: |
            dist/github-stats?username=Hk-Gosuto&background=linear-gradient%280deg%2C+%23e83b3bFF+0%25%2C+%23fbff86FF+100%25%29+&color=%234d65b4FF
            dist/github-stats-dark?username=Hk-Gosuto&theme=crt

      - name: Push cards to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
